name: E2E Playwright

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

env:
  FRAPPE_VERSION: ${{ vars.FRAPPE_VERSION || '15' }}
  ERPNEXT_VERSION: ${{ vars.ERPNEXT_VERSION || '15' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install MariaDB client
        run: sudo apt-get update && sudo apt-get install -y mariadb-client

      - name: Build Frappe bench and install apps
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --python "$(which python)" --frappe-branch "version-$FRAPPE_VERSION" ~/frappe-bench
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"
          cd ~/frappe-bench
          bench get-app production_entry_app "$GITHUB_WORKSPACE"
          bench get-app --branch "version-$ERPNEXT_VERSION" erpnext
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password 123 development.localhost
          bench --site development.localhost install-app erpnext
          bench --site development.localhost install-app production_entry_app
          bench build
          bench --site development.localhost execute erpnext.setup.setup_wizard.operations.install_fixtures.install --args '["India"]'

      - name: Install Playwright deps
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Start site server
        run: |
          cd ~/frappe-bench
          nohup bench --site development.localhost serve --port 8002 --noreload > /tmp/bench-serve.log 2>&1 &
          for i in {1..45}; do
            if curl -sSf http://localhost:8002/login >/dev/null; then
              echo "Server is up"
              exit 0
            fi
            sleep 2
          done
          echo "Server failed to start"
          tail -n 200 /tmp/bench-serve.log
          exit 1

      - name: Run Playwright smoke on PRs
        if: github.event_name != 'schedule'
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8002
          PLAYWRIGHT_USERNAME: Administrator
          PLAYWRIGHT_PASSWORD: 123
        run: npm run test:e2e

      - name: Run Playwright full regression nightly
        if: github.event_name == 'schedule'
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8002
          PLAYWRIGHT_USERNAME: Administrator
          PLAYWRIGHT_PASSWORD: 123
        run: npm run test:e2e:ci

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results

      - name: Upload bench logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-serve-log
          path: /tmp/bench-serve.log
