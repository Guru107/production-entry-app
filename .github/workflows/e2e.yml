name: E2E Playwright

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

jobs:
  prepare-e2e-shared-artifacts:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install shared Node deps and Playwright browser
        run: |
          npm install
          npx playwright install chromium

      - name: Upload Playwright browsers artifact
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shared-playwright-browsers
          path: /home/runner/.cache/ms-playwright
          retention-days: 1

  e2e:
    needs: prepare-e2e-shared-artifacts
    runs-on: ubuntu-latest
    env:
      FRAPPE_VERSION: ${{ matrix.frappe_version }}
      ERPNEXT_VERSION: ${{ matrix.erpnext_version }}
      PLAYWRIGHT_ROUTE_PREFIX: ${{ matrix.route_prefix }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
    strategy:
      fail-fast: false
      matrix:
        include:
          - frappe_version: "15"
            erpnext_version: "15"
            route_prefix: "app"
            python_version: "3.10"
            node_version: "20"
          - frappe_version: "16"
            erpnext_version: "16"
            route_prefix: "desk"
            python_version: "3.14"
            node_version: "24"
    name: E2E v${{ matrix.frappe_version }}-erp${{ matrix.erpnext_version }}
    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node_version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-e2e-py${{ matrix.python_version }}-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-e2e-py${{ matrix.python_version }}-
            ${{ runner.os }}-pip-e2e-

      - name: Download shared Playwright browsers
        uses: actions/download-artifact@v4
        with:
          name: e2e-shared-playwright-browsers
          path: /home/runner/.cache/ms-playwright

      - name: Restore Playwright binary permissions
        run: |
          shopt -s nullglob

          headless_shell_bins=(/home/runner/.cache/ms-playwright/chromium_headless_shell-*/chrome-headless-shell-linux64/chrome-headless-shell)
          chromium_bins=(/home/runner/.cache/ms-playwright/chromium-*/chrome-linux/chrome)
          ffmpeg_bins=(/home/runner/.cache/ms-playwright/ffmpeg-*/ffmpeg-linux)

          for bin in "${headless_shell_bins[@]}" "${chromium_bins[@]}" "${ffmpeg_bins[@]}"; do
            if [ -e "$bin" ]; then
              chmod +x "$bin"
              ls -l "$bin"
            fi
          done

          echo "headless_shell_bins=${#headless_shell_bins[@]} chromium_bins=${#chromium_bins[@]} ffmpeg_bins=${#ffmpeg_bins[@]}"

      - name: Verify Playwright executables
        run: |
          shopt -s nullglob

          headless_shell_bins=(/home/runner/.cache/ms-playwright/chromium_headless_shell-*/chrome-headless-shell-linux64/chrome-headless-shell)
          chromium_bins=(/home/runner/.cache/ms-playwright/chromium-*/chrome-linux/chrome)

          if [ ${#headless_shell_bins[@]} -eq 0 ]; then
            echo "ERROR: required Playwright headless shell binary not found under /home/runner/.cache/ms-playwright"
            exit 1
          fi

          for bin in "${headless_shell_bins[@]}"; do
            if [ ! -x "$bin" ]; then
              echo "ERROR: required Playwright headless shell binary is not executable: $bin"
              ls -l "$bin" || true
              exit 1
            fi
          done

          if [ ${#chromium_bins[@]} -eq 0 ]; then
            echo "INFO: chromium UI binary not present in artifact; continuing with headless-shell-only artifact"
          else
            for bin in "${chromium_bins[@]}"; do
              if [ ! -x "$bin" ]; then
                echo "WARNING: chromium UI binary exists but is not executable: $bin"
                ls -l "$bin" || true
              fi
            done
          fi

      - name: Install MariaDB client
        run: sudo apt-get update && sudo apt-get install -y mariadb-client

      - name: Build Frappe bench and install apps
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --python "$(which python)" --frappe-branch "version-$FRAPPE_VERSION" ~/frappe-bench
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"
          cd ~/frappe-bench
          bench get-app production_entry_app "$GITHUB_WORKSPACE"
          bench get-app --branch "version-$ERPNEXT_VERSION" erpnext
          bench setup requirements --dev
          bench build

      - name: Install Playwright deps
        run: |
          npm install
          if [ "$FRAPPE_VERSION" = "16" ]; then
            npx playwright install chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Run Playwright smoke on PRs
        if: github.event_name != 'schedule'
        run: |
          chmod +x scripts/run_ephemeral_e2e.sh
          BENCH_ROOT=~/frappe-bench DB_ROOT_PASSWORD=root scripts/run_ephemeral_e2e.sh smoke

      - name: Run Playwright full regression nightly
        if: github.event_name == 'schedule'
        run: |
          chmod +x scripts/run_ephemeral_e2e.sh
          BENCH_ROOT=~/frappe-bench DB_ROOT_PASSWORD=root scripts/run_ephemeral_e2e.sh ci

      - name: Check artifact paths
        if: always()
        id: artifact_paths
        run: |
          if [ -d playwright-report ] && [ "$(ls -A playwright-report 2>/dev/null)" ]; then
            echo "has_playwright_report=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_playwright_report=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -d test-results ] && [ "$(ls -A test-results 2>/dev/null)" ]; then
            echo "has_test_results=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_test_results=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -f /tmp/bench-serve.log ]; then
            echo "has_bench_log=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_bench_log=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Playwright report
        if: always() && steps.artifact_paths.outputs.has_playwright_report == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-v${{ matrix.frappe_version }}-erp${{ matrix.erpnext_version }}
          path: playwright-report

      - name: Upload test results
        if: always() && steps.artifact_paths.outputs.has_test_results == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-v${{ matrix.frappe_version }}-erp${{ matrix.erpnext_version }}
          path: test-results

      - name: Upload bench logs
        if: always() && steps.artifact_paths.outputs.has_bench_log == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bench-serve-log-v${{ matrix.frappe_version }}-erp${{ matrix.erpnext_version }}
          path: /tmp/bench-serve.log
