name: E2E Playwright

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      FRAPPE_VERSION: ${{ matrix.frappe_version }}
      ERPNEXT_VERSION: ${{ matrix.erpnext_version }}
      PLAYWRIGHT_ROUTE_PREFIX: ${{ matrix.route_prefix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - frappe_version: "15"
            erpnext_version: "15"
            route_prefix: "app"
            python_version: "3.10"
            node_version: "20"
          - frappe_version: "16"
            erpnext_version: "16"
            route_prefix: "desk"
            python_version: "3.14"
            node_version: "24"
    name: E2E v${{ matrix.frappe_version }}-erp${{ matrix.erpnext_version }}
    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node_version }}

      - name: Install MariaDB client
        run: sudo apt-get update && sudo apt-get install -y mariadb-client

      - name: Build Frappe bench and install apps
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --python "$(which python)" --frappe-branch "version-$FRAPPE_VERSION" ~/frappe-bench
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"
          cd ~/frappe-bench
          bench get-app production_entry_app "$GITHUB_WORKSPACE"
          bench get-app --branch "version-$ERPNEXT_VERSION" erpnext
          bench setup requirements --dev
          bench build

      - name: Install Playwright deps
        run: |
          npm install
          if [ "$FRAPPE_VERSION" = "16" ]; then
            npx playwright install chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Run Playwright smoke on PRs
        if: github.event_name != 'schedule'
        run: |
          chmod +x scripts/run_ephemeral_e2e.sh
          BENCH_ROOT=~/frappe-bench DB_ROOT_PASSWORD=root scripts/run_ephemeral_e2e.sh smoke

      - name: Run Playwright full regression nightly
        if: github.event_name == 'schedule'
        run: |
          chmod +x scripts/run_ephemeral_e2e.sh
          BENCH_ROOT=~/frappe-bench DB_ROOT_PASSWORD=root scripts/run_ephemeral_e2e.sh ci

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-v${{ matrix.frappe_version }}-erp${{ matrix.erpnext_version }}
          path: playwright-report

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-v${{ matrix.frappe_version }}-erp${{ matrix.erpnext_version }}
          path: test-results

      - name: Upload bench logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-serve-log-v${{ matrix.frappe_version }}-erp${{ matrix.erpnext_version }}
          path: /tmp/bench-serve.log
